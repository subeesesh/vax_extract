<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaccination Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<style>
:root {
  --page: #eef0f3; --sheet: #ffffff; --folder: #e6dcc3; --folder-edge: #cdbf9c; --folder-ink: #5c4f2e;
  --ink: #1b1d2e; --muted: #5d6175; --rule: #dde0e7;
  --stamp: #3a3fb0; --stamp-soft: #e7e8f8; --on-stamp: #ffffff;
  --ok: #18794e; --ok-soft: #e2f3ea; --soon: #9a5800; --soon-soft: #fbefd9; --bad: #bc3328; --bad-soft: #fbe6e3;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #15161d; --sheet: #1d1f29; --folder: #2b2619; --folder-edge: #463d26; --folder-ink: #d9c99f;
    --ink: #e7e8ef; --muted: #9ea2b6; --rule: #2e313e;
    --stamp: #9196ff; --stamp-soft: #262a4d; --on-stamp: #11132a;
    --ok: #5ccf95; --ok-soft: #15301f; --soon: #f0b357; --soon-soft: #33270f; --bad: #ff8a7d; --bad-soft: #3a1b18;
  }
}
:root[data-theme="dark"] {
  --page: #15161d; --sheet: #1d1f29; --folder: #2b2619; --folder-edge: #463d26; --folder-ink: #d9c99f;
  --ink: #e7e8ef; --muted: #9ea2b6; --rule: #2e313e;
  --stamp: #9196ff; --stamp-soft: #262a4d; --on-stamp: #11132a;
  --ok: #5ccf95; --ok-soft: #15301f; --soon: #f0b357; --soon-soft: #33270f; --bad: #ff8a7d; --bad-soft: #3a1b18;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 15px/1.5 var(--font); font-variant-numeric: tabular-nums; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }

/* ---------- top bar ---------- */
.bar { max-width: 1320px; margin: 0 auto; padding: 22px 28px 0; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.bar h1 { margin: 0; font-size: 22px; font-weight: 800; font-stretch: 125%; letter-spacing: -.01em; }
.bar p { margin: 0; color: var(--muted); }

/* ---------- layout ---------- */
.desk { max-width: 1320px; margin: 0 auto; padding: 22px 28px 48px; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 28px; align-items: start; }
@media (max-width: 920px) { .desk { grid-template-columns: minmax(0, 1fr); padding: 16px 16px 40px; gap: 20px; } .bar { padding: 18px 16px 0; } }

/* ---------- folder (the record) ---------- */
.folder { position: sticky; top: 18px; padding-top: 30px; min-width: 0; }
@media (max-width: 920px) { .folder { position: relative; top: 0; } .drop { min-height: 200px; } }
.tab { position: absolute; top: 0; left: 0; max-width: 75%; height: 31px; padding: 6px 16px 0; background: var(--folder); border: 1px solid var(--folder-edge); border-bottom: 0; border-radius: 6px 6px 0 0;
  color: var(--folder-ink); font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.folder-body { background: var(--folder); border: 1px solid var(--folder-edge); border-radius: 0 6px 6px 6px; padding: 14px; }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 440px; padding: 28px;
  border: 2px dashed var(--folder-edge); border-radius: 4px; text-align: center; cursor: pointer; color: var(--folder-ink); }
.drop:hover, .drop.over { border-color: var(--stamp); background: color-mix(in srgb, var(--stamp) 6%, transparent); }
.drop svg { width: 52px; height: 52px; }
.drop strong { font-size: 19px; font-weight: 700; font-stretch: 112%; color: var(--ink); }
.drop span { max-width: 32ch; }
.drop:focus-within { outline: 2px solid var(--stamp); outline-offset: 2px; }
.paper { background: var(--sheet); border-radius: 2px; box-shadow: 0 1px 0 var(--folder-edge), 0 8px 18px -12px rgb(60 45 10 / .45); overflow: hidden; }
.paper img { display: block; width: 100%; height: auto; }
.paper iframe { display: block; width: 100%; height: min(78vh, 760px); border: 0; }
.paper .noprev { padding: 60px 20px; text-align: center; color: var(--muted); }
.folder-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; color: var(--folder-ink); font-size: 13px; }
.linkbtn { background: none; border: 0; padding: 4px 2px; color: var(--stamp); font-weight: 600; cursor: pointer; }
.linkbtn:hover { text-decoration: underline; }
.folder-actions .linkbtn { color: var(--folder-ink); text-decoration: underline; }

/* ---------- requirements ---------- */
.req { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 20px 22px 18px; }
.req-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
.req-head .linkbtn { white-space: nowrap; }
.req h2 { margin: 0; font-size: 17px; font-weight: 700; font-stretch: 112%; }
.req-head div { display: flex; gap: 10px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(190px, 100%), 1fr)); gap: 2px 18px; margin: 0; padding: 0; list-style: none; }
.checks li { display: flex; align-items: center; gap: 4px; min-width: 0; }
.checks label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; }
.checks input { appearance: none; flex: none; width: 20px; height: 20px; margin: 0; border: 2px solid var(--muted); border-radius: 4px; display: grid; place-items: center; cursor: pointer; }
.checks input:checked { background: var(--stamp); border-color: var(--stamp); }
.checks input:checked::after { content: ""; width: 10px; height: 5px; border: solid var(--on-stamp); border-width: 0 0 2.5px 2.5px; transform: translateY(-1px) rotate(-45deg); }
.checks .nm { overflow-wrap: anywhere; }
.checks input:not(:checked) + .nm { color: var(--muted); }
.rm { flex: none; width: 28px; height: 28px; border: 0; border-radius: 4px; background: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
.rm:hover { background: var(--bad-soft); color: var(--bad); }
.add { display: flex; gap: 8px; margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--rule); }
.add input { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--page); }
.add input::placeholder { color: var(--muted); }
.btn2 { padding: 9px 16px; border: 1px solid var(--stamp); border-radius: 6px; background: none; color: var(--stamp); font-weight: 600; cursor: pointer; }
.btn2:hover { background: var(--stamp-soft); }

.go { display: flex; align-items: center; gap: 16px; margin: 18px 0 26px; flex-wrap: wrap; }
.go button { padding: 13px 28px; border: 0; border-radius: 6px; background: var(--stamp); color: var(--on-stamp); font-size: 16px; font-weight: 700; font-stretch: 110%; cursor: pointer; }
.go button:disabled { background: var(--rule); color: var(--muted); cursor: not-allowed; }
.go span { color: var(--muted); }

/* ---------- result sheet ---------- */
.sheet { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 2px; padding: 26px 26px 20px; margin-bottom: 22px; }
.sheet + .sheet { margin-top: 0; }
.pet { margin: 0 150px 2px 0; font-size: clamp(26px, 4vw, 36px); line-height: 1.1; font-weight: 800; font-stretch: 125%; letter-spacing: -.015em; overflow-wrap: anywhere; }
.pet-meta { margin: 0 150px 18px 0; color: var(--muted); }
@media (max-width: 560px) { .pet, .pet-meta { margin-right: 0; } .sheet { padding: 20px 16px 16px; } }

.stamp { position: absolute; top: 22px; right: 20px; padding: 7px 12px 6px; border: 3px double currentColor; border-radius: 6px; transform: rotate(-7deg);
  font-weight: 900; font-stretch: 125%; font-size: 15px; line-height: 1.1; text-align: center; letter-spacing: .01em; opacity: .9; }
.stamp small { display: block; font-size: 11px; font-weight: 600; font-stretch: 100%; }
.stamp.ok { color: var(--ok); } .stamp.soon { color: var(--soon); } .stamp.bad { color: var(--bad); }
.landed .stamp { animation: land .38s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes land { from { transform: rotate(-16deg) scale(1.7); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: .9; } }
@media (max-width: 560px) { .stamp { position: static; display: inline-block; margin: 0 0 14px; } }
@media (prefers-reduced-motion: reduce) { .landed .stamp { animation: none; } }

.vax { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.vax li { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1.25fr); gap: 4px 18px; padding: 13px 0; border-bottom: 1px solid var(--rule); }
.vax .name { font-weight: 700; font-stretch: 108%; overflow-wrap: anywhere; }
.vax .printed { display: block; font-weight: 400; font-stretch: 100%; font-size: 13px; color: var(--muted); }
.state { font-weight: 700; display: flex; align-items: flex-start; gap: 8px; }
.state::before { content: ""; flex: none; width: 9px; height: 9px; margin-top: 7px; border-radius: 50%; background: currentColor; }
.state.ok { color: var(--ok); } .state.soon { color: var(--soon); } .state.bad { color: var(--bad); }
.when { font-size: 14px; }
.when b { font-weight: 600; }
.when div { color: var(--muted); }
.note { grid-column: 1 / -1; margin-top: 4px; padding: 8px 10px; border-left: 3px solid var(--soon); background: var(--soon-soft); font-size: 13px; }
@media (max-width: 560px) { .vax li { grid-template-columns: 1fr 1fr; } .vax .name { grid-column: 1 / -1; } }

.doc-note { margin: 0 0 22px; padding: 12px 14px; border-left: 3px solid var(--soon); background: var(--soon-soft); }
.doc-note strong { display: block; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 26px; margin: 16px 0 0; font-size: 13px; color: var(--muted); }
.facts dt { display: inline; }
.facts dd { display: inline; margin: 0 0 0 4px; color: var(--ink); }

details { border-top: 1px solid var(--rule); }
details:last-of-type { border-bottom: 1px solid var(--rule); }
summary { padding: 12px 0; cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; width: 7px; height: 7px; border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform .15s; }
details[open] > summary::before { transform: rotate(45deg); }
summary span { color: var(--muted); font-weight: 400; }
.sheet details { margin-top: 18px; } .sheet details + details { margin-top: 0; }
.scroll { overflow-x: auto; padding-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 7px 10px 7px 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); }
th { font-weight: 600; color: var(--muted); white-space: nowrap; }
td.d { white-space: nowrap; }
.quote { color: var(--muted); font-style: italic; min-width: 200px; }
.latest { margin-left: 6px; padding: 1px 6px; border-radius: 3px; background: var(--stamp-soft); color: var(--stamp); font-size: 11.5px; font-weight: 600; }
.flag { display: block; color: var(--soon); font-size: 12.5px; }
pre { margin: 0 0 12px; padding: 14px; max-height: 420px; overflow: auto; background: var(--page); border-radius: 4px; font: 12px/1.45 ui-monospace, Consolas, monospace; }
.json-actions { display: flex; gap: 10px; padding-bottom: 14px; }

/* ---------- states ---------- */
.waiting { padding: 36px 26px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 2px; }
.waiting strong { font-size: 18px; font-weight: 700; font-stretch: 112%; }
.waiting p { margin: 4px 0 18px; color: var(--muted); }
.track { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.track i { display: block; width: 35%; height: 100%; background: var(--stamp); animation: slide 1.3s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
@media (prefers-reduced-motion: reduce) { .track i { animation: none; width: 100%; opacity: .5; } }
.failed { padding: 18px 20px; background: var(--bad-soft); color: var(--bad); border-radius: 4px; }
.failed strong { display: block; }
.failed span { color: var(--ink); }
.idle { color: var(--muted); max-width: 52ch; }
.idle p { margin: 0 0 8px; }
</style>
</head>
<body>
<div class="bar">
  <h1>Vaccination check</h1>
  <p>See which required vaccines a pet's record covers, and whether they're still valid.</p>
</div>

<main class="desk">
  <section class="folder" aria-label="Vet record">
    <div class="tab" id="tab">No record yet</div>
    <div class="folder-body">
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff,.bmp" class="sr" style="position:absolute;opacity:0;width:1px;height:1px">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5h17l9 9v29H12z"/><path d="M29 5v9h9"/><path d="M19 24h12M19 30h12M19 36h7"/>
        </svg>
        <strong>Drop the vet record here</strong>
        <span>or click to choose a file. Photos, scans and PDFs up to 25 MB all work.</span>
      </label>
      <div id="shown" hidden>
        <div class="paper" id="preview"></div>
        <div class="folder-actions"><span id="fsize"></span><button class="linkbtn" id="swap" type="button">Use a different record</button></div>
      </div>
    </div>
  </section>

  <section>
    <div class="req">
      <div class="req-head">
        <h2>Required vaccines</h2>
        <div><button class="linkbtn" id="all" type="button">Check all</button><button class="linkbtn" id="none" type="button">Uncheck all</button></div>
      </div>
      <ul class="checks" id="checks"></ul>
      <form class="add" id="addForm">
        <input id="addName" placeholder="Another vaccine, e.g. Leptospirosis" aria-label="Vaccine name to add" autocomplete="off">
        <button class="btn2" type="submit">Add</button>
      </form>
    </div>

    <div class="go">
      <button id="go" type="button" disabled>Check record</button>
      <span id="goHint" aria-live="polite"></span>
    </div>

    <div id="out" aria-live="polite">
      <div class="idle">
        <p>Each pet on the record gets its own sheet: the date each required vaccine was given, when it runs out, and anything a person should double-check.</p>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const parse = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const fmt = (iso) => { if (!iso) return null; const t = parse(iso); return `${t.getDate()} ${MONTHS[t.getMonth()]} ${t.getFullYear()}`; };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const daysUntil = (iso) => Math.round((parse(iso) - today()) / 864e5);
function span(days) {
  const a = Math.abs(days);
  if (a < 1) return "today";
  if (a < 45) return `${a} day${a === 1 ? "" : "s"}`;
  if (a < 548) return `${Math.round(a / 30.4)} months`;
  const y = Math.round(a / 365.25 * 2) / 2;
  return `${y} years`;
}
const SOON_DAYS = 30;

let file = null, previewUrl = null, names = [], selected = new Set(), lastResult = null;
const custom = () => store.get("vax.custom", []);

// ---------- required vaccines ----------
function renderChecks() {
  const mine = custom();
  $("#checks").innerHTML = names.map((n, i) => `<li>
    <label><input type="checkbox" data-i="${i}" ${selected.has(n) ? "checked" : ""}><span class="nm">${esc(n)}</span></label>
    ${mine.includes(n) ? `<button class="rm" type="button" data-del="${i}" aria-label="Remove ${esc(n)}" title="Remove">×</button>` : ""}
  </li>`).join("");
  store.set("vax.selected", [...selected]);
  updateGo();
}
$("#checks").addEventListener("change", (e) => {
  const n = names[+e.target.dataset.i];
  e.target.checked ? selected.add(n) : selected.delete(n);
  store.set("vax.selected", [...selected]); updateGo();
});
$("#checks").addEventListener("click", (e) => {
  const b = e.target.closest("[data-del]"); if (!b) return;
  const n = names[+b.dataset.del];
  store.set("vax.custom", custom().filter((x) => x !== n));
  names = names.filter((x) => x !== n); selected.delete(n); renderChecks();
});
$("#all").onclick = () => { names.forEach((n) => selected.add(n)); renderChecks(); };
$("#none").onclick = () => { selected.clear(); renderChecks(); };
$("#addForm").onsubmit = (e) => {
  e.preventDefault();
  const n = $("#addName").value.trim().replace(/;/g, ",");
  if (!n) return;
  let hit = names.find((x) => x.toLowerCase() === n.toLowerCase());
  if (!hit) { names.push(n); store.set("vax.custom", [...custom(), n]); hit = n; }
  selected.add(hit); $("#addName").value = ""; renderChecks();
};
fetch("/api/targets").then((r) => r.json()).then((defaults) => {
  names = [...defaults, ...custom().filter((c) => !defaults.includes(c))];
  const saved = store.get("vax.selected", null);
  (saved ?? defaults).filter((n) => names.includes(n)).forEach((n) => selected.add(n));
  renderChecks();
}).catch(() => { $("#checks").innerHTML = `<li class="idle">Couldn't load the vaccine list. Add names below.</li>`; });

// ---------- the record ----------
const drop = $("#drop");
function setFile(f) {
  if (!f) return;
  file = f;
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl = URL.createObjectURL(f);
  const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
  $("#preview").innerHTML = /\.tiff?$/i.test(f.name)
    ? `<div class="noprev">Your browser can't preview TIFF files, but the check will still read it.</div>`
    : isPdf ? `<iframe src="${previewUrl}" title="Preview of ${esc(f.name)}"></iframe>` : `<img src="${previewUrl}" alt="Preview of ${esc(f.name)}">`;
  $("#tab").textContent = f.name;
  $("#fsize").textContent = f.size > 1048576 ? `${(f.size / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(f.size / 1024))} KB`;
  drop.hidden = true; $("#shown").hidden = false;
  updateGo();
}
$("#file").onchange = (e) => setFile(e.target.files[0]);
$("#swap").onclick = () => $("#file").click();
["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
document.addEventListener("drop", (e) => setFile(e.dataTransfer?.files?.[0]));

function updateGo() {
  $("#go").disabled = !file;
  $("#goHint").textContent = !file ? "Add a vet record first." : !selected.size ? "No vaccines checked: extracts what's printed." : `Checks ${selected.size} vaccine${selected.size > 1 ? "s" : ""}.`;
}

// ---------- check ----------
$("#go").onclick = async () => {
  const targets = names.filter((n) => selected.has(n));
  const fd = new FormData();
  fd.append("file", file); fd.append("targets", targets.join(";")); fd.append("full", "true");
  $("#go").disabled = true;
  const t0 = performance.now();
  $("#out").innerHTML = `<div class="waiting"><strong>Reading ${esc(file.name)}</strong>
    <p>Usually under 15 seconds. <span id="tick">0</span> s so far.</p><div class="track"><i></i></div></div>`;
  const timer = setInterval(() => { const t = $("#tick"); if (t) t.textContent = Math.round((performance.now() - t0) / 1000); }, 500);
  try {
    const r = await fetch("/api/extract", { method: "POST", body: fd });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.detail || `The server answered ${r.status}.`);
    lastResult = body; render(body);
  } catch (err) {
    $("#out").innerHTML = `<div class="failed"><strong>The record couldn't be read.</strong>
      <span>${esc(err.message)} A sharper photo or the original PDF usually fixes this.</span></div>`;
  } finally { clearInterval(timer); updateGo(); }
};

// ---------- results ----------
function judge(v) {
  if (!v.matchedComponents.length) return { cls: "bad", word: "Not on record" };
  let s;
  if (!v.expirationDate) s = { cls: "soon", word: "No expiry printed" };
  else {
    const d = daysUntil(v.expirationDate);
    s = d < 0 ? { cls: "bad", word: "Expired" } : d <= SOON_DAYS ? { cls: "soon", word: "Expires soon" } : { cls: "ok", word: "Current" };
  }
  if (v.needsHumanReview && s.cls === "ok") s = { cls: "soon", word: "Current, check it" };
  return s;
}
function whenCell(v) {
  if (!v.matchedComponents.length) return `<div>Nothing on this record matches.</div>`;
  const lines = [];
  if (v.expirationDate) {
    const d = daysUntil(v.expirationDate);
    lines.push(d < 0 ? `Ran out <b>${fmt(v.expirationDate)}</b><div>${span(d)} ago</div>` : `Valid until <b>${fmt(v.expirationDate)}</b><div>${d === 0 ? "ends today" : span(d) + " left"}${v.expirationDateSource === "derived" ? ", calculated from the printed interval" : ""}</div>`);
  }
  lines.push(`<div>Given ${v.dateAdministered ? fmt(v.dateAdministered) : "on an unprinted date"}</div>`);
  return lines.join("");
}
function stampFor(vs) {
  const js = vs.map(judge);
  const bad = js.filter((j) => j.cls === "bad").length, soon = js.filter((j) => j.cls === "soon").length;
  if (!bad && !soon) return `<div class="stamp ok">All current<small>${vs.length} of ${vs.length} valid</small></div>`;
  return `<div class="stamp ${bad ? "bad" : "soon"}">${bad + soon} to check<small>${vs.length - bad - soon} of ${vs.length} valid</small></div>`;
}

function render(res) {
  const { data, meta } = res;
  const docFlags = meta.reviewReasons.filter((r) => !/vaccination event\(s\) flagged/.test(r));
  let html = docFlags.length ? `<div class="doc-note"><strong>Double-check this record against the original.</strong>${esc(docFlags.join("; "))}</div>` : "";

  if (!data.pets.length) html += `<div class="failed"><strong>No pets or vaccines were found on this record.</strong>
    <span>Make sure the file is a vaccination history, certificate or invoice, and that the text is readable.</span></div>`;

  for (const p of data.pets) {
    const mapped = p.vaccinations.length > 0;  // no requested vaccines -> extraction only, show the printed rows
    const rows = mapped ? p.events : p.printedRows;  // printed rows: a dose already carries its reminder's due date
    const meta2 = [p.species, p.breed, p.sex, p.color].filter(Boolean).map((x) => esc(x === x.toUpperCase() ? x.toLowerCase().replace(/^\w/, (c) => c.toUpperCase()) : x)).join(", ");
    html += `<article class="sheet">
      ${p.vaccinations.length ? stampFor(p.vaccinations) : ""}
      <h2 class="pet">${esc(p.name || "Unnamed pet")}</h2>
      <p class="pet-meta">${meta2 || "&nbsp;"}</p>
      <ul class="vax">${p.vaccinations.map((v) => { const j = judge(v); return `<li>
        <div class="name">${esc(v.name)}${v.vaccine_name ? `<span class="printed">Printed as ${esc(v.vaccine_name)}${v.partialMatch ? " (covers part of it)" : ""}</span>` : ""}</div>
        <div class="state ${j.cls}">${j.word}</div>
        <div class="when">${whenCell(v)}</div>
        ${v.reviewReasons.length ? `<div class="note">Check against the record: ${esc(v.reviewReasons.join("; "))}.</div>` : ""}
      </li>`; }).join("")}</ul>
      ${rows.length ? `<details${mapped ? "" : " open"}><summary>Everything printed on the record <span>${rows.length} line${rows.length > 1 ? "s" : ""}</span></summary><div class="scroll"><table>
        <thead><tr><th>As printed</th>${mapped ? "<th>Counts toward</th>" : ""}<th>Given</th><th>Due</th><th>From the record</th></tr></thead>
        <tbody>${rows.map((e) => `<tr>
          <td>${esc(e.rawName)}${e.isLatest ? `<span class="latest">latest</span>` : ""}${e.reviewReasons.length ? `<span class="flag">${esc(e.reviewReasons.join("; "))}</span>` : ""}</td>
          ${mapped ? `<td>${e.target ? esc(e.target) + (e.partial ? " (part)" : "") : `<span class="quote">not required</span>`}</td>` : ""}
          <td class="d">${fmt(e.dateAdministered) ?? "–"}</td>
          <td class="d">${fmt(e.dueDate) ?? "–"}${e.dueDateSource === "derived" ? "*" : ""}</td>
          <td class="quote">${esc(e.evidence)}</td></tr>`).join("")}</tbody></table></div></details>` : ""}
      ${p.diagnosticTests.length ? `<details><summary>Tests <span>${p.diagnosticTests.length}</span></summary><div class="scroll"><table>
        <thead><tr><th>Test</th><th>Done</th><th>Due</th><th>From the record</th></tr></thead>
        <tbody>${p.diagnosticTests.map((t) => `<tr><td>${esc(t.rawName || t.name)}</td><td class="d">${fmt(t.dateAdministered) ?? "–"}</td>
          <td class="d">${fmt(t.dueDate) ?? "–"}</td><td class="quote">${esc(t.evidence)}</td></tr>`).join("")}</tbody></table></div></details>` : ""}
    </article>`;
  }

  const owner = data.owner?.name, clinic = data.clinic?.name, vet = data.veterinarian?.name;
  html += `<dl class="facts">
    ${owner ? `<div><dt>Owner</dt><dd>${esc(owner)}</dd></div>` : ""}
    ${clinic ? `<div><dt>Clinic</dt><dd>${esc(clinic)}</dd></div>` : ""}
    ${vet ? `<div><dt>Vet</dt><dd>${esc(vet)}</dd></div>` : ""}
    <div><dt>Read in</dt><dd>${res.duration.toFixed(1)} s</dd></div>
    <div><dt>Pages</dt><dd>${meta.pages}</dd></div>
  </dl>
  <details open style="margin-top:16px"><summary>Final JSON <span>the output, as returned by the API and stored in the sheet</span></summary>
    <pre>${esc(JSON.stringify(res.output, null, 2))}</pre>
    <div class="json-actions"><button class="btn2" id="copyJson" type="button">Copy JSON</button><button class="btn2" id="dlJson" type="button">Download JSON</button></div>
  </details>`;

  const out = $("#out");
  out.innerHTML = html;
  requestAnimationFrame(() => out.querySelectorAll(".sheet").forEach((s) => s.classList.add("landed")));
  $("#copyJson").onclick = async (e) => {
    try { await navigator.clipboard.writeText(JSON.stringify(lastResult.output, null, 2)); e.target.textContent = "Copied"; }
    catch { e.target.textContent = "Copy blocked by browser"; }
  };
  $("#dlJson").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(lastResult.output, null, 2)], { type: "application/json" }));
    a.download = (file?.name || "record").replace(/\.[^.]+$/, "") + ".json"; a.click();
  };
}
</script>
</body>
</html>
